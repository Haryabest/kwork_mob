<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KWork Mob Admin — Materialize</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet" />
  <link href="admin-demo-base.css" rel="stylesheet" />
  <style>
    :root { --demo-primary: #1565c0; }
    body { background: #fafafa; }
    .sidenav { width: 260px; }
    .sidenav .brand { padding: 20px; background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; }
    .sidenav li>a { height: 44px; line-height: 44px; font-size: 0.9rem; }
    .sidenav li>a.active { background: rgba(21,101,192,.12); border-right: 3px solid #1565c0; }
    .main-wrap { margin-left: 260px; padding: 16px 24px 48px; }
    @media (max-width: 992px) { .main-wrap { margin-left: 0; } }
    .vpn-chip { background: #e3f2fd; color: #1565c0; padding: 6px 14px; border-radius: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <ul id="slide-out" class="sidenav sidenav-fixed">
    <li><div class="brand"><h5 style="margin:0">KWork Mob</h5><small>Materialize · §11</small></div></li>
    <li><div class="divider"></div></li>
    <li id="nav-exit"><a href="#!"><i class="material-icons">exit_to_app</i>Выход</a></li>
  </ul>
  <nav class="blue darken-2 hide-on-large-only"><div class="nav-wrapper"><a href="#" data-target="slide-out" class="sidenav-trigger"><i class="material-icons">menu</i></a><a class="brand-logo center">Admin</a></div></nav>
  <main class="main-wrap">
    <div class="row" style="margin-bottom:12px"><div class="col s12"><span class="vpn-chip">VPN · Redis OK</span> <a class="btn-flat" id="themeBtn"><i class="material-icons">brightness_4</i></a></div></div>
    <div id="app"></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script src="admin-pages-content.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => M.Sidenav.init(document.querySelectorAll('.sidenav')));
    const exitLi = document.getElementById('nav-exit');
    ADMIN_NAV.forEach((n) => {
      const li = document.createElement('li');
      li.innerHTML = `<a href="#!" class="nav-item" data-page="${n.id}"><i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:8px">chevron_right</i>${n.label}</a>`;
      exitLi.parentNode.insertBefore(li, exitLi);
    });
    bindAdminPage('app', '.nav-item', { primary: '#1565c0', secondary: '#43a047' });
    themeBtn.onclick = () => { document.body.style.filter = document.body.style.filter ? '' : 'invert(1) hue-rotate(180deg)'; };
  </script>
</body>
</html>
