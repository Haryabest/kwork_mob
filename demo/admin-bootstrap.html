<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KWork Mob Admin — Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="admin-demo-base.css" rel="stylesheet" />
  <style>
    :root { --demo-primary: #0057b8; }
    body { font-size: 0.9rem; background: #f4f7fb; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: linear-gradient(180deg, #0b1f3a, #132f54); color: #fff; padding: 16px; flex-shrink: 0; }
    .sidebar .nav-link { color: rgba(255,255,255,.75); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,.12); color: #fff; }
    .main { flex: 1; }
    .topbar { background: linear-gradient(90deg, #0d6efd, #0057b8); color: #fff; padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    #app { padding: 24px; }
    [data-bs-theme="dark"] body { background: #0f1419; }
    [data-bs-theme="dark"] .demo-card, [data-bs-theme="dark"] .demo-kpi { background: #1a2332; border-color: #2a3544; color: #e0e0e0; }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="d-flex align-items-center gap-2 mb-3"><span class="badge bg-primary">3D</span><strong>KWork Mob</strong></div>
    <small class="text-white-50 d-block mb-3">Bootstrap 5 · §11</small>
    <nav class="nav flex-column gap-1" id="nav"></nav>
    <small class="text-white-50 mt-4 d-block">admin@example.com</small>
  </aside>
  <div class="main">
    <div class="topbar">
      <span><i class="bi bi-shield-lock"></i> VPN · WireGuard · Redis OK</span>
      <div><button class="btn btn-sm btn-light" id="themeBtn"><i class="bi bi-moon"></i></button> <button class="btn btn-sm btn-outline-light">Выход</button></div>
    </div>
    <div id="app"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="admin-pages-content.js"></script>
<script>
  const nav = document.getElementById('nav');
  ADMIN_NAV.forEach((n) => { nav.innerHTML += `<a class="nav-link nav-item" href="#" data-page="${n.id}">${n.icon} ${n.label}</a>`; });
  bindAdminPage('app', '.nav-item', { primary: '#0057b8', secondary: '#198754' });
  document.getElementById('themeBtn').onclick = () => {
    const h = document.documentElement;
    h.setAttribute('data-bs-theme', h.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
