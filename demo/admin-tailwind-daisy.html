<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KWork Mob Admin — Tailwind + DaisyUI</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="admin-demo-base.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --demo-primary: #6366f1; }
    body { font-family: 'DM Sans', sans-serif; }
    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: rgba(0,0,0,.25); border-right: 1px solid rgba(255,255,255,.08); padding: 16px; }
    .sidebar a { display: block; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; text-decoration: none; color: inherit; opacity: 0.75; margin-bottom: 2px; }
    .sidebar a.active { background: rgba(99,102,241,.25); border-left: 3px solid #6366f1; opacity: 1; }
    .topbar { padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; align-items: center; }
    #app { padding: 24px; max-width: 1200px; }
    [data-theme="light"] .sidebar { background: #f8fafc; border-color: #e2e8f0; }
  </style>
</head>
<body class="bg-base-300">
<div class="shell">
  <aside class="sidebar">
    <div class="font-bold text-lg mb-1">KWork Mob</div>
    <p class="text-xs opacity-50 mb-4">Tailwind + DaisyUI</p>
    <nav id="nav"></nav>
  </aside>
  <div class="flex-1">
    <div class="topbar">
      <span class="badge badge-success badge-outline">VPN OK</span>
      <label class="swap swap-rotate btn btn-ghost btn-sm btn-circle"><input type="checkbox" id="themeSwap" /><span class="swap-on">☀️</span><span class="swap-off">🌙</span></label>
    </div>
    <div id="app"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="admin-pages-content.js"></script>
<script>
  ADMIN_NAV.forEach((n) => { nav.innerHTML += `<a class="nav-item" href="#" data-page="${n.id}">${n.icon} ${n.label}</a>`; });
  bindAdminPage('app', '.nav-item', { primary: '#818cf8', secondary: '#34d399' });
  themeSwap.onchange = (e) => document.documentElement.setAttribute('data-theme', e.target.checked ? 'light' : 'dark');
</script>
</body>
</html>
